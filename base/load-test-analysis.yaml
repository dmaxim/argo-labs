apiVersion: argoproj.io/v1alpha1
kind: AnalysisTemplate
metadata:
  name: loadtest
spec:
  metrics:
  - name: loadtest-vote
    provider:
      job:
        spec:
          template:
            spec:
              containers:
              - name: siege
                image: schoolofdevops/loadtest:v1
                command:
                  - siege
                  - "--concurrent=2"
                  - "--benchmark"
                  - "--time=5m"
                  - "--header='X-Canary: siege'" # Add this header which limits the load test so it only hits the canary service - matches the annotation in the Rollout
                  - "https://vote.danmaxim.net"
              restartPolicy: Never
              # hostAliases:
              # - ip: "xx.xx.xx.xx"
              #   hostnames:
              #   - "vote.example.com"
          backoffLimit: 4